apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: api-rest-jwt-spring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: mramoscli/rest-jwt-spring:1.5
        ports:
        - containerPort: 8080
